---
deployment:
  tasks:
    - export DEPLOYPATH=/home/btsbmuww/public_html/stickken/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    - /bin/cp -rf css $DEPLOYPATH
    - /bin/cp -rf js $DEPLOYPATH
    - /bin/chmod -R 755 $DEPLOYPATH
    - /bin/chmod 644 $DEPLOYPATH/index.html
    - /bin/chmod 644 $DEPLOYPATH/.htaccess
    - /bin/chmod -R 755 $DEPLOYPATH/css
    - /bin/chmod -R 755 $DEPLOYPATH/js
    - /bin/chmod 644 $DEPLOYPATH/css/*
    - /bin/chmod 644 $DEPLOYPATH/js/*
